<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08080f">
<title>YouAura</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #08080f; color: #fff; overflow: hidden; }
body { background: radial-gradient(ellipse at top, #1a1a3e 0%, #08080f 70%); }
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
.logo-icon { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #ffb347, #ff7f50); display: flex; align-items: center; justify-content: center; font-size: 17px; }
.balance { display: flex; gap: 6px; }
.bal-item { padding: 6px 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 12px; font-weight: 700; }
.content { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.content::-webkit-scrollbar { display: none; }
.greeting { font-size: 28px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; margin: 16px 0 4px; }
.greeting-name { background: linear-gradient(135deg, #fff 0%, #ffb347 60%, #ff7f50 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.greeting-sub { font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 20px; }
.btn { width: 100%; padding: 16px; margin-bottom: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; color: #fff; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 12px; }
.btn:active { transform: scale(0.97); background: rgba(255,255,255,0.08); }
.btn-icon { width: 40px; height: 40px; border-radius: 11px; background: rgba(255,179,71,0.1); border: 1px solid rgba(255,179,71,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.btn-info { flex: 1; }
.btn-title { font-weight: 800; font-size: 15px; }
.btn-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; font-weight: 500; }
.btn.support .btn-icon { background: rgba(106,77,255,0.15); border-color: rgba(106,77,255,0.3); }
.btn.back { background: rgba(255,127,80,0.08); border-color: rgba(255,127,80,0.3); }
.btn.back .btn-icon { background: rgba(255,127,80,0.15); border-color: rgba(255,127,80,0.3); }
.spread-btn { width: 100%; padding: 14px 16px; margin-bottom: 8px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; color: #fff; text-align: left; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 10px; }
.spread-btn:active { transform: scale(0.98); background: rgba(255,127,80,0.1); border-color: rgba(255,179,71,0.5); }
.spread-num { width: 30px; height: 30px; line-height: 30px; text-align: center; background: linear-gradient(135deg, #ffb347, #ff7f50); border-radius: 9px; font-weight: 900; color: #08080f; flex-shrink: 0; font-size: 14px; }
.back-btn { padding: 8px 0; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 8px; font-family: inherit; }
.title { font-size: 22px; font-weight: 900; margin: 8px 0 12px; }
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.35s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.cards-row { display: flex; justify-content: center; gap: 6px; margin: 14px 0; flex-wrap: wrap; perspective: 1000px; }
.card { width: 72px; height: 120px; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
.card.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 4px; text-align: center; }
.card-back { background: linear-gradient(135deg, #1a1a3e, #0f0f28); border: 2px solid rgba(255,179,71,0.35); font-size: 30px; color: rgba(255,179,71,0.6); }
.card-front { transform: rotateY(180deg); background: #1e1e3f; border: 2px solid rgba(255,179,71,0.7); padding: 0; overflow: hidden; position: relative; }
.card-front img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.card-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 4px; }
.card-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 2px 2px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.9)); color: #ffb347; font-size: 7px; font-weight: 800; text-align: center; text-transform: uppercase; line-height: 1.1; }
.big-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #ffb347, #ff7f50); border: none; border-radius: 16px; color: #08080f; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 10px; font-family: inherit; box-shadow: 0 8px 30px rgba(255,127,80,0.35); }
.big-btn:active { transform: scale(0.97); }
.big-btn:disabled { opacity: 0.4; }
.q-input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 14px; font-family: inherit; margin: 12px 0; resize: none; }
.q-input::placeholder { color: rgba(255,255,255,0.35); }
.q-input:focus { outline: none; border-color: rgba(255,179,71,0.5); }
.q-locked { padding: 12px 14px; background: rgba(255,179,71,0.08); border: 1px solid rgba(255,179,71,0.3); border-radius: 12px; margin: 12px 0; font-size: 14px; color: #ffb347; font-weight: 600; }
.q-locked .ql-label { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
.interp { margin-top: 16px; }
.interp-title { font-size: 15px; font-weight: 800; margin-bottom: 10px; color: #ffb347; }
.interp-item { padding: 12px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 8px; }
.interp-pos { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }
.interp-name { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
.interp-meaning { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.4; }
.summary { padding: 14px; background: rgba(255,179,71,0.08); border: 1px solid rgba(255,179,71,0.35); border-radius: 14px; margin-top: 10px; }
.summary-title { font-size: 11px; color: #ffb347; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
.summary-text { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.5; }
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #ffb347, #ff7f50); color: #08080f; padding: 12px 22px; border-radius: 100px; font-weight: 800; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 99; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.daily-box { text-align: center; padding: 24px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,179,71,0.25); border-radius: 20px; margin-top: 16px; }
.daily-img { width: 150px; height: 250px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,179,71,0.7); margin-bottom: 14px; box-shadow: 0 12px 40px rgba(255,179,71,0.4); }
.daily-name { font-size: 22px; font-weight: 900; color: #ffb347; margin-bottom: 6px; }
.daily-meaning { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; }
.profile-card { padding: 24px 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; text-align: center; margin-top: 12px; }
.avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ffb347, #ff7f50); display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #08080f; margin-bottom: 12px; box-shadow: 0 12px 30px rgba(255,127,80,0.35); }
.profile-name { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.profile-level { display: inline-block; padding: 5px 14px; background: rgba(255,179,71,0.1); border: 1px solid rgba(255,179,71,0.35); border-radius: 100px; font-size: 12px; font-weight: 800; color: #ffb347; }
.stats { display: flex; justify-content: space-around; margin-top: 16px; }
.stat { text-align: center; }
.stat-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
.stat-value { font-size: 24px; font-weight: 900; margin-top: 4px; color: #ffb347; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><div class="logo-icon">Y</div><div>YouAura</div></div>
    <div class="balance">
      <div class="bal-item" id="hBal">0</div>
      <div class="bal-item" id="hAcc">0</div>
    </div>
  </div>

  <div class="content">
    <div class="screen active" id="s-home">
      <div class="greeting">Привет,<br><span class="greeting-name" id="gName">друг</span> ✨</div>
      <div class="greeting-sub">Карты готовы говорить с тобой</div>

      <button class="btn" onclick="go('s-spread')">
        <div class="btn-icon">🔮</div>
        <div class="btn-info">
          <div class="btn-title">Сделать расклад</div>
          <div class="btn-desc">5 видов · 78 карт</div>
        </div>
      </button>

      <button class="btn" onclick="drawDaily()">
        <div class="btn-icon">🌅</div>
        <div class="btn-info">
          <div class="btn-title">Карта дня</div>
          <div class="btn-desc">Прогноз на сегодня</div>
        </div>
      </button>

      <button class="btn" onclick="go('s-profile')">
        <div class="btn-icon">👤</div>
        <div class="btn-info">
          <div class="btn-title">Мой профиль</div>
          <div class="btn-desc">Баланс и статистика</div>
        </div>
      </button>

      <button class="btn support" onclick="openSupport()">
        <div class="btn-icon">✉️</div>
        <div class="btn-info">
          <div class="btn-title">Поддержка</div>
          <div class="btn-desc">Написать админу</div>
        </div>
      </button>

      <button class="btn back" onclick="backToBot()">
        <div class="btn-icon">⬅️</div>
        <div class="btn-info">
          <div class="btn-title">Вернуться в бот</div>
          <div class="btn-desc">Закрыть приложение</div>
        </div>
      </button>
    </div>

    <div class="screen" id="s-spread">
      <button class="back-btn" onclick="go('s-home')">‹ Назад</button>
      <div class="title">Выбери расклад</div>

      <button class="spread-btn" onclick="startReading(1,'Одна карта')">
        <div class="spread-num">1</div>
        <div><div class="btn-title">Одна карта</div><div class="btn-desc">Совет на сегодня</div></div>
      </button>
      <button class="spread-btn" onclick="startReading(3,'Три карты')">
        <div class="spread-num">2</div>
        <div><div class="btn-title">Три карты</div><div class="btn-desc">Прошлое · Настоящее · Будущее</div></div>
      </button>
      <button class="spread-btn" onclick="startReading(5,'Крест')">
        <div class="spread-num">3</div>
        <div><div class="btn-title">Крест</div><div class="btn-desc">5 карт · глубокий разбор</div></div>
      </button>
      <button class="spread-btn" onclick="startReading(7,'Подкова')">
        <div class="spread-num">4</div>
        <div><div class="btn-title">Подкова</div><div class="btn-desc">7 карт · ситуация</div></div>
      </button>
      <button class="spread-btn" onclick="startReading(10,'Кельтский крест')">
        <div class="spread-num">5</div>
        <div><div class="btn-title">Кельтский крест</div><div class="btn-desc">10 карт · полная картина</div></div>
      </button>
    </div>

    <div class="screen" id="s-reading">
      <button class="back-btn" id="backFromReading" onclick="go('s-spread')">‹ Назад</button>
      <div class="title" id="rtitle">Расклад</div>
      
      <textarea class="q-input" id="qinput" placeholder="Твой вопрос (необязательно)" rows="2"></textarea>
      <div class="q-locked" id="qlocked" style="display:none">
        <div class="ql-label">Твой вопрос</div>
        <div id="qlocked-text">-</div>
      </div>
      
      <div class="cards-row" id="carea"></div>
      
      <button class="big-btn" id="dbtn" onclick="drawCards()">Вытянуть карты</button>
      <button class="big-btn" id="fbtn" onclick="finishReading()" style="display:none">Отправить в бот</button>
      
      <div class="interp" id="interp" style="display:none"></div>
    </div>

    <div class="screen" id="s-profile">
      <button class="back-btn" onclick="go('s-home')">‹ Назад</button>
      <div class="title">Профиль</div>
      <div class="profile-card">
        <div class="avatar" id="av">?</div>
        <div class="profile-name" id="pn">Друг</div>
        <div class="profile-level" id="pl">Новичок</div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Раскладов</div><div class="stat-value" id="pvFree">0</div></div>
          <div class="stat"><div class="stat-label">Разборов</div><div class="stat-value" id="pvAcc">0</div></div>
        </div>
      </div>
    </div>

    <div class="screen" id="s-result">
      <button class="back-btn" onclick="go('s-home')">‹ На главную</button>
      <div class="title">Карта дня</div>
      <div class="daily-box" id="dbox"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

var params = new URLSearchParams(window.location.search);
var balance = parseInt(params.get('bal') || '0');
var access = parseInt(params.get('acc') || '0');
var userName = params.get('name') || 'друг';
var readings = parseInt(params.get('read') || '0');

document.getElementById('hBal').textContent = 'Раскладов: ' + balance;
document.getElementById('hAcc').textContent = 'Разборов: ' + access;
document.getElementById('gName').textContent = userName;
document.getElementById('pvFree').textContent = balance;
document.getElementById('pvAcc').textContent = access;
document.getElementById('pn').textContent = userName;
if (userName.length > 0) document.getElementById('av').textContent = userName.charAt(0).toUpperCase();

var level = 'Новичок';
if (readings >= 10) level = 'Ученик';
if (readings >= 30) level = 'Практик';
if (readings >= 75) level = 'Таролог';
if (readings >= 150) level = 'Мастер';
if (readings >= 300) level = 'Гуру';
if (readings >= 500) level = 'Легенда';
document.getElementById('pl').textContent = level;

  {n:'Императрица', m:'Изобилие, забота. Время расцвета.', img:RWS+'RWS_Tarot_03_Empress.jpg'},

  {n:'Иерофант', m:'Традиция, обучение. Ищи ответ в опыте.', img:RWS+'RWS_Tarot_05_Hierophant.jpg'},

var POSITIONS = {
  1: ['Совет'],
  3: ['Прошлое', 'Настоящее', 'Будущее'],
  5: ['Суть', 'Причина', 'Итог', 'Блок', 'Совет'],
  7: ['Прошлое', 'Настоящее', 'Скрытое', 'Препятствие', 'Окружение', 'Совет', 'Итог'],
  10: ['Суть', 'Препятствие', 'Основа', 'Прошлое', 'Цель', 'Будущее', 'Вы', 'Окружение', 'Надежды и страхи', 'Итог']
};

var state = { count: 0, cards: [], title: '', question: '', drawn: false };

function go(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  var c = document.querySelector('.content');
  if (c) c.scrollTop = 0;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function startReading(count, title) {
  if (balance < 1) {
    showToast('Нет раскладов. Активируй код в боте.');
    return;
  }
  state.count = count;
  state.title = title;
  state.cards = [];
  state.question = '';
  state.drawn = false;
  
  document.getElementById('rtitle').textContent = title;
  document.getElementById('carea').innerHTML = '';
  document.getElementById('qinput').value = '';
  document.getElementById('qinput').style.display = 'block';
  document.getElementById('qlocked').style.display = 'none';
  document.getElementById('interp').style.display = 'none';
  document.getElementById('interp').innerHTML = '';
  document.getElementById('dbtn').style.display = 'block';
  document.getElementById('dbtn').disabled = false;
  document.getElementById('fbtn').style.display = 'none';
  document.getElementById('backFromReading').style.display = 'block';
  
  go('s-reading');
}

function drawCards() {
  if (state.drawn) return;
  
  state.question = document.getElementById('qinput').value.trim() || 'без вопроса';
  state.drawn = true;
  
  document.getElementById('qinput').style.display = 'none';
  document.getElementById('qlocked').style.display = 'block';
  document.getElementById('qlocked-text').textContent = state.question;
  document.getElementById('backFromReading').style.display = 'none';
  
  var area = document.getElementById('carea');
  area.innerHTML = '';
  state.cards = [];

  var used = {};
  for (var i = 0; i < state.count; i++) {
    var idx;
    do { idx = Math.floor(Math.random() * CARDS.length); } while (used[idx]);
    used[idx] = true;
    var card = CARDS[idx];
    state.cards.push(card);

    var el = document.createElement('div');
    el.className = 'card';

    var front = '<img src="' + card.img + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="card-fallback" style="display:none"><div style="font-size:13px;color:#ffb347;font-weight:800;padding:4px;text-align:center">' + card.n + '</div></div><div class="card-label">' + card.n + '</div>';

    el.innerHTML = '<div class="card-face card-back">*</div><div class="card-face card-front">' + front + '</div>';
    area.appendChild(el);

    (function(el, delay) {
      setTimeout(function() { el.classList.add('flipped'); }, delay);
    })(el, 400 + i * 150);
  }

  setTimeout(function() {
    document.getElementById('dbtn').style.display = 'none';
    document.getElementById('fbtn').style.display = 'block';
    showInterpretation();
  }, 400 + state.count * 150 + 900);
}

function showInterpretation() {
  var interp = document.getElementById('interp');
  var positions = POSITIONS[state.count] || [];
  var html = '<div class="interp-title">Разбор расклада</div>';
  
  for (var i = 0; i < state.cards.length; i++) {
    var card = state.cards[i];
    var pos = positions[i] || ('Позиция ' + (i + 1));
    html += '<div class="interp-item">';
    html += '<div class="interp-pos">' + pos + '</div>';
    html += '<div class="interp-name">' + card.n + '</div>';
    html += '<div class="interp-meaning">' + card.m + '</div>';
    html += '</div>';
  }
  
  var adviceCard = state.cards[state.cards.length - 1];
  html += '<div class="summary">';
  html += '<div class="summary-title">Общий совет</div>';
  html += '<div class="summary-text">' + adviceCard.m + '</div>';
  html += '</div>';
  
  interp.innerHTML = html;
  interp.style.display = 'block';
}

function finishReading() {
  var cardsStr = '';
  for (var i = 0; i < state.cards.length; i++) {
    if (i > 0) cardsStr += ', ';
    cardsStr += state.cards[i].n;
  }

  var payload = 'reading|' + state.title + '|' + state.count + '|' + cardsStr + '|' + state.question;

  if (tg && tg.sendData) {
    try {
      tg.sendData(payload);
      setTimeout(function() { try { tg.close(); } catch(e) {} }, 100);
    } catch(e) {
      showToast('Ошибка: ' + e.message);
    }
  } else {
    showToast('Открой из Telegram');
  }
}

function openSupport() {
  if (tg && tg.sendData) {
    try {
      tg.sendData('support|||');
      setTimeout(function() { try { tg.close(); } catch(e) {} }, 100);
    } catch(e) {
      showToast('Ошибка: ' + e.message);
    }
  } else {
    showToast('Открой из Telegram');
  }
}

function backToBot() {
  if (tg && tg.sendData) {
    try {
      tg.sendData('back|||');
      setTimeout(function() { try { tg.close(); } catch(e) {} }, 100);
    } catch(e) {}
  } else {
    showToast('Открой из Telegram');
  }
}

function drawDaily() {
  var card = CARDS[Math.floor(Math.random() * CARDS.length)];
  var html = '<img class="daily-img" src="' + card.img + '" onerror="this.style.display=\'none\'"><br>';
  html += '<div class="daily-name">' + card.n + '</div>';
  html += '<div class="daily-meaning">' + card.m + '</div>';
  document.getElementById('dbox').innerHTML = html;
  go('s-result');
}
