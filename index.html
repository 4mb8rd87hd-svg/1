<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08080f">
<title>YouAura</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #08080f; color: #fff; overflow: hidden; }
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.logo { font-size: 16px; font-weight: 800; }
.balance { display: flex; gap: 6px; }
.balance-item { padding: 6px 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 12px; font-weight: 700; }
.content { flex: 1; overflow-y: auto; padding-bottom: 20px; }
.content::-webkit-scrollbar { display: none; }
.hero { font-size: 26px; font-weight: 900; margin: 16px 0 6px; }
.subtitle { font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 20px; }
.btn { width: 100%; padding: 16px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; color: #fff; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; font-family: inherit; }
.btn:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
.btn-title { font-weight: 800; font-size: 15px; }
.btn-desc { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.card-btn { width: 100%; padding: 14px 16px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: #fff; text-align: left; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 10px; }
.card-btn:active { transform: scale(0.98); background: rgba(255,127,80,0.1); }
.card-num { width: 30px; height: 30px; line-height: 30px; text-align: center; background: linear-gradient(135deg, #ffb347, #ff7f50); border-radius: 9px; font-weight: 900; color: #08080f; flex-shrink: 0; font-size: 14px; }
.back-btn { padding: 8px 0; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 8px; font-family: inherit; }
.title { font-size: 22px; font-weight: 900; margin: 8px 0 12px; }
.screen { display: none; }
.screen.active { display: block; }
.cards-area { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; min-height: 140px; perspective: 1000px; }
.card { width: 76px; height: 128px; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
.card.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; border-radius: 11px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 6px; text-align: center; }
.card-back { background: #1a1a3e; border: 2px solid rgba(255,179,71,0.35); font-size: 34px; color: rgba(255,179,71,0.6); }
.card-front { transform: rotateY(180deg); background: #1e1e3f; border: 2px solid rgba(255,179,71,0.7); padding: 0; overflow: hidden; position: relative; }
.card-front img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
.card-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 6px; }
.card-symbol { font-size: 36px; }
.card-name { font-size: 9px; font-weight: 800; color: #ffb347; margin-top: 6px; text-transform: uppercase; text-align: center; }
.card-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 3px 3px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.9)); color: #ffb347; font-size: 8px; font-weight: 800; text-align: center; text-transform: uppercase; }
.big-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #ffb347, #ff7f50); border: none; border-radius: 16px; color: #08080f; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 10px; font-family: inherit; }
.big-btn:active { transform: scale(0.97); }
.big-btn:disabled { opacity: 0.4; }
.q-input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 14px; font-family: inherit; margin: 12px 0; resize: none; }
.q-input::placeholder { color: rgba(255,255,255,0.35); }
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #ffb347, #ff7f50); color: #08080f; padding: 12px 22px; border-radius: 100px; font-weight: 800; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 99; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.daily-box { text-align: center; padding: 24px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,179,71,0.25); border-radius: 20px; margin-top: 16px; }
.daily-img { width: 140px; height: 235px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,179,71,0.7); margin-bottom: 14px; }
.daily-name { font-size: 22px; font-weight: 900; color: #ffb347; margin-bottom: 6px; }
.daily-meaning { font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.5; }
.profile-card { padding: 24px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; text-align: center; margin-top: 16px; }
.avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ffb347, #ff7f50); display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: #08080f; margin-bottom: 12px; }
.profile-name { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.stats { display: flex; justify-content: space-around; margin-top: 16px; }
.stat { text-align: center; }
.stat-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
.stat-value { font-size: 24px; font-weight: 900; margin-top: 4px; color: #ffb347; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">YouAura</div>
    <div class="balance">
      <div class="balance-item" id="hBal">0</div>
      <div class="balance-item" id="hAcc">0</div>
    </div>
  </div>

  <div class="content">
    <div class="screen active" id="s-home">
      <div class="hero">Привет</div>
      <div class="subtitle">Таро в твоём кармане</div>

      <button class="btn" onclick="go('s-spread')">
        <div class="btn-title">Сделать расклад</div>
        <div class="btn-desc">5 видов карт</div>
      </button>

      <button class="btn" onclick="drawDaily()">
        <div class="btn-title">Карта дня</div>
        <div class="btn-desc">Прогноз на сегодня</div>
      </button>

      <button class="btn" onclick="go('s-profile')">
        <div class="btn-title">Мой профиль</div>
        <div class="btn-desc">Баланс и статистика</div>
      </button>

      <button class="btn" onclick="backToBot()">
        <div class="btn-title">Вернуться в бот</div>
        <div class="btn-desc">Закрыть приложение</div>
      </button>
    </div>

    <div class="screen" id="s-spread">
      <button class="back-btn" onclick="go('s-home')">Назад</button>
      <div class="title">Выбери расклад</div>

      <button class="card-btn" onclick="startReading(1,'Одна карта')">
        <div class="card-num">1</div>
        <div><div class="btn-title">Одна карта</div><div class="btn-desc">Совет на сегодня</div></div>
      </button>
      <button class="card-btn" onclick="startReading(3,'Три карты')">
        <div class="card-num">2</div>
        <div><div class="btn-title">Три карты</div><div class="btn-desc">Прошлое, настоящее, будущее</div></div>
      </button>
      <button class="card-btn" onclick="startReading(5,'Крест')">
        <div class="card-num">3</div>
        <div><div class="btn-title">Крест</div><div class="btn-desc">5 карт</div></div>
      </button>
      <button class="card-btn" onclick="startReading(7,'Подкова')">
        <div class="card-num">4</div>
        <div><div class="btn-title">Подкова</div><div class="btn-desc">7 карт</div></div>
      </button>
      <button class="card-btn" onclick="startReading(10,'Кельтский крест')">
        <div class="card-num">5</div>
        <div><div class="btn-title">Кельтский крест</div><div class="btn-desc">10 карт</div></div>
      </button>
    </div>

    <div class="screen" id="s-reading">
      <div class="title" id="rtitle">Расклад</div>
      <textarea class="q-input" id="qinput" placeholder="Твой вопрос (необязательно)" rows="2"></textarea>
      <div class="cards-area" id="carea"></div>
      <button class="big-btn" id="dbtn" onclick="drawCards()">Вытянуть карты</button>
      <button class="big-btn" id="fbtn" onclick="finishReading()" style="display:none">Отправить в бот</button>
    </div>

    <div class="screen" id="s-profile">
      <button class="back-btn" onclick="go('s-home')">Назад</button>
      <div class="title">Профиль</div>
      <div class="profile-card">
        <div class="avatar" id="av">?</div>
        <div class="profile-name" id="pn">Друг</div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Раскладов</div><div class="stat-value" id="pvFree">0</div></div>
          <div class="stat"><div class="stat-label">Разборов</div><div class="stat-value" id="pvAcc">0</div></div>
        </div>
      </div>
    </div>

    <div class="screen" id="s-result">
      <button class="back-btn" onclick="go('s-home')">На главную</button>
      <div class="title">Карта дня</div>
      <div class="daily-box" id="dbox"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e) {} }

var params = new URLSearchParams(window.location.search);
var balance = parseInt(params.get('bal') || '0');
var access = parseInt(params.get('acc') || '0');
var userName = params.get('name') || 'друг';

document.getElementById('hBal').textContent = 'Раскладов: ' + balance;
document.getElementById('hAcc').textContent = 'Разборов: ' + access;
document.getElementById('pvFree').textContent = balance;
document.getElementById('pvAcc').textContent = access;
document.getElementById('pn').textContent = userName;
if (userName.length > 0) {
  document.getElementById('av').textContent = userName.charAt(0).toUpperCase();
}

var RWS = 'https://commons.wikimedia.org/wiki/Special:FilePath/';

var CARDS = [
  {n:'Шут', s:'A', img:RWS+'RWS_Tarot_00_Fool.jpg'},
  {n:'Маг', s:'B', img:RWS+'RWS_Tarot_01_Magician.jpg'},
  {n:'Верховная Жрица', s:'C', img:RWS+'RWS_Tarot_02_High_Priestess.jpg'},
  {n:'Императрица', s:'D', img:RWS+'RWS_Tarot_03_Empress.jpg'},
  {n:'Император', s:'E', img:RWS+'RWS_Tarot_04_Emperor.jpg'},
  {n:'Иерофант', s:'F', img:RWS+'RWS_Tarot_05_Hierophant.jpg'},
  {n:'Влюблённые', s:'G', img:RWS+'RWS_Tarot_06_Lovers.jpg'},
  {n:'Колесница', s:'H', img:RWS+'RWS_Tarot_07_Chariot.jpg'},
  {n:'Сила', s:'I', img:RWS+'RWS_Tarot_08_Strength.jpg'},
  {n:'Отшельник', s:'J', img:RWS+'RWS_Tarot_09_Hermit.jpg'},
  {n:'Колесо Фортуны', s:'K', img:RWS+'RWS_Tarot_10_Wheel_of_Fortune.jpg'},
  {n:'Правосудие', s:'L', img:RWS+'RWS_Tarot_11_Justice.jpg'},
  {n:'Повешенный', s:'M', img:RWS+'RWS_Tarot_12_Hanged_Man.jpg'},
  {n:'Смерть', s:'N', img:RWS+'RWS_Tarot_13_Death.jpg'},
  {n:'Умеренность', s:'O', img:RWS+'RWS_Tarot_14_Temperance.jpg'},
  {n:'Дьявол', s:'P', img:RWS+'RWS_Tarot_15_Devil.jpg'},
  {n:'Башня', s:'Q', img:RWS+'RWS_Tarot_16_Tower.jpg'},
  {n:'Звезда', s:'R', img:RWS+'RWS_Tarot_17_Star.jpg'},
  {n:'Луна', s:'S', img:RWS+'RWS_Tarot_18_Moon.jpg'},
  {n:'Солнце', s:'T', img:RWS+'RWS_Tarot_19_Sun.jpg'},
  {n:'Суд', s:'U', img:RWS+'RWS_Tarot_20_Judgement.jpg'},
  {n:'Мир', s:'V', img:RWS+'RWS_Tarot_21_World.jpg'}
];

var state = { count: 0, cards: [], title: '' };

function go(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function startReading(count, title) {
  if (balance < 1) {
    showToast('Нет раскладов на балансе');
    return;
  }
  state.count = count;
  state.title = title;
  state.cards = [];
  document.getElementById('rtitle').textContent = title;
  document.getElementById('carea').innerHTML = '';
  document.getElementById('dbtn').style.display = 'block';
  document.getElementById('dbtn').disabled = false;
  document.getElementById('fbtn').style.display = 'none';
  document.getElementById('qinput').value = '';
  go('s-reading');
}

function drawCards() {
  var area = document.getElementById('carea');
  area.innerHTML = '';
  state.cards = [];
  document.getElementById('dbtn').disabled = true;

  var used = {};
  for (var i = 0; i < state.count; i++) {
    var idx;
    do { idx = Math.floor(Math.random() * CARDS.length); } while (used[idx]);
    used[idx] = true;
    var card = CARDS[idx];
    state.cards.push(card);

    var el = document.createElement('div');
    el.className = 'card';

    var front = '';
    if (card.img) {
      front = '<img src="' + card.img + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="card-fallback" style="display:none"><div class="card-symbol">' + card.s + '</div><div class="card-name">' + card.n + '</div></div><div class="card-label">' + card.n + '</div>';
    } else {
      front = '<div class="card-fallback"><div class="card-symbol">' + card.s + '</div><div class="card-name">' + card.n + '</div></div>';
    }

    el.innerHTML = '<div class="card-face card-back">*</div><div class="card-face card-front">' + front + '</div>';
    area.appendChild(el);

    (function(el, delay) {
      setTimeout(function() { el.classList.add('flipped'); }, delay);
    })(el, 400 + i * 180);
  }

  setTimeout(function() {
    document.getElementById('fbtn').style.display = 'block';
    document.getElementById('dbtn').style.display = 'none';
  }, 400 + state.count * 180 + 900);
}

function finishReading() {
  var question = document.getElementById('qinput').value || '-';
  var cardsStr = '';
  for (var i = 0; i < state.cards.length; i++) {
    if (i > 0) cardsStr += ', ';
    cardsStr += state.cards[i].n;
  }

  var payload = 'reading|' + state.title + '|' + state.count + '|' + cardsStr + '|' + question;

  if (tg && tg.sendData) {
    try {
      tg.sendData(payload);
      setTimeout(function() {
        try { tg.close(); } catch(e) {}
      }, 100);
    } catch(e) {
      showToast('Ошибка: ' + e.message);
    }
  } else {
    showToast('Открой из Telegram');
  }
}

function backToBot() {
  if (tg && tg.sendData) {
    try {
      tg.sendData('back|||');
      setTimeout(function() { try { tg.close(); } catch(e) {} }, 100);
    } catch(e) {}
  } else {
    showToast('Открой из Telegram');
  }
}

function drawDaily() {
  var card = CARDS[Math.floor(Math.random() * CARDS.length)];
  var html = '';
  if (card.img) {
    html = '<img class="daily-img" src="' + card.img + '" onerror="this.style.display=\'none\'"><br>';
  } else {
    html = '<div style="font-size:70px;margin-bottom:14px">' + card.s + '</div>';
  }
  html += '<div class="daily-name">' + card.n + '</div>';
  document.getElementById('dbox').innerHTML = html;
  go('s-result');
}
</script>
</body>
</html>
